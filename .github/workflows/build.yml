name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Seule source du numéro de version : préfixe + numéro de build GitHub.
      VERSION_NAME: 0.2.${{ github.run_number }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Vérifier les secrets de signature
        id: cle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "presente=true" >> "$GITHUB_OUTPUT"
          else
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents : le code est compilé pour vérification, mais aucun APK installable n'est publié."
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Décoder la clé de signature
        if: steps.cle.outputs.presente == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: suivinutri
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Remonter les erreurs de compilation
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          {
            grep -E "^e: " build.log | head -40
            awk '/What went wrong/{n=30} n>0{print; n--}' build.log
          } > erreurs.txt || true
          [ -s erreurs.txt ] || tail -40 build.log > erreurs.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' erreurs.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Erreurs de build::$msg"

      - name: Vérifier la signature
        if: steps.cle.outputs.presente == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" "suivi-nutri-$VERSION_NAME.apk"

      - name: Garder l'APK comme artefact
        if: steps.cle.outputs.presente == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: suivi-nutri-${{ env.VERSION_NAME }}
          path: suivi-nutri-${{ env.VERSION_NAME }}.apk

      - name: Publier la release
        if: steps.cle.outputs.presente == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Suivi nutri ${{ env.VERSION_NAME }}
          body: APK signé avec la clé fixe. À installer par-dessus la version précédente, sans désinstaller.
          files: suivi-nutri-${{ env.VERSION_NAME }}.apk

      - name: Signaler l'absence de clé
        if: steps.cle.outputs.presente != 'true'
        run: |
          echo "::error::Compilation OK, mais pas d'APK publié : ajoute les secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), puis relance."
          exit 1
