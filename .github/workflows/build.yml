name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 et/ou KEYSTORE_PASSWORD absents. Ajoute-les dans Settings > Secrets and variables > Actions, puis relance le build."
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Décoder la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Construire l'APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: suivinutri
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Vérifier la signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" "suivi-nutri-$VERSION_NAME.apk"

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: suivi-nutri-${{ env.VERSION_NAME }}
          path: suivi-nutri-${{ env.VERSION_NAME }}.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Suivi nutri ${{ env.VERSION_NAME }}
          body: APK signé avec la clé fixe. À installer par-dessus la version précédente, sans désinstaller.
          files: suivi-nutri-${{ env.VERSION_NAME }}.apk
